[package]
name = "remilia-desktop"
version = "0.1.0"
description = "Remilia Bot Manager - Desktop Client"
authors = ["KomeiDiSanXian"]
edition = "2021"

[lib]
name = "remilia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 配对约束：tauri / tauri-plugin-* 这些 crate 与 npm 侧的 @tauri-apps/* 必须保持同一
# major.minor，否则 `tauri build` 会在编译前直接报 "version mismatched Tauri packages"。
# 这里用 ~ 锁住 minor：单边刷新 lock（例如某次依赖 PR）不会被顶到新的 minor 而配对失败；
# 跨 minor 升级时请在同一个提交里同时改 Cargo.toml 与 desktop/package.json 两侧。
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "~2.5"
# 自动更新：updater 负责检查/下载/校验签名，process 提供安装完成后的 relaunch
# Windows 版 updater 用 zip 解压更新包。2.14.1 起它依赖 zip ^9（此前是 ^4），
# 而 zip < 9.0.5 存在解压相关漏洞（CVE-2026-115905 等），因此不要降到 2.14.0。
# 升级后 Cargo.lock 中的 zip 为 9.x，`cargo update zip` 可以正常使用。
tauri-plugin-updater = "~2.14"
tauri-plugin-process = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
