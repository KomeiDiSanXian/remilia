[package]
name = "remilia-desktop"
version = "0.1.0"
description = "Remilia Bot Manager - Desktop Client"
authors = ["KomeiDiSanXian"]
edition = "2021"

[lib]
name = "remilia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
