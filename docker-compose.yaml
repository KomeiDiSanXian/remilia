version: "3.9"

services:
  remilia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/KomeiDiSanXian/remilia:${VERSION:-latest}
    container_name: remilia-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9001:9001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - remilia-data:/app/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

