# Remilia Bot 配置文件示例 (v1.1.0)
# 复制此文件为 config.yaml 并填入你的实际配置

# ====================================
# Bot 基础配置（必填）
# ====================================
bot:
  # Bot 的 AppID
  app_id: 123456789

  # Bot 的 BotID
  bot_id: 987654321

  # Bot 的 Token（请妥善保管，不要提交到代码仓库）
  token: "your_bot_token_here"

  # Bot 的 AppSecret（请妥善保管，不要提交到代码仓库）
  secret: "your_bot_secret_here"

# ====================================
# 服务器配置
# ====================================
server:
  # Webhook 监听地址
  host: "0.0.0.0"

  # Webhook 监听端口
  port: 8080

  # 优雅关闭超时时间
  # 格式: "5s", "10s", "30s" 等
  shutdown_timeout: "10s"

# ====================================
# 日志配置
# ====================================
log:
  # 日志级别: debug, info, warn, error
  level: "info"

  # 日志输出格式: text, json
  format: "text"

# ====================================
# 并发控制配置（可选）
# v0.7.0+ 支持反压机制
# ====================================
concurrency:
  # 最大并发数，<=0 表示不限制
  # 推荐值: 100-1000（根据服务器性能调整）
  limit: 500

  # 反压策略: drop（丢弃）, block（阻塞）, trywait（尝试等待）
  # - drop: 超过限制时丢弃新事件（适合允许丢失的场景）
  # - block: 超过限制时阻塞等待（适合不能丢失的场景）
  # - trywait: 尝试等待一段时间，超时后丢弃（推荐）
  policy: "trywait"

  # 等待超时时间（仅 trywait 策略生效）
  # 格式: "200ms", "1s", "2s" 等
  wait_timeout: "500ms"

  # Webhook 事件通道缓冲大小
  # 推荐值: 100-1000（根据流量调整）
  event_buffer: 1000

# ====================================
# 重试配置（可选）
# v0.7.0+ 支持自动重试机制
# ====================================
retry:
  # 是否启用自动重试
  enable: true

  # 最大重试次数（不包括首次尝试）
  # 推荐值: 2-3 次
  max_attempts: 3

  # 重试退避基础时间
  # 格式: "100ms", "200ms", "500ms" 等
  backoff_base: "200ms"

  # 重试退避最大时间
  # 格式: "1s", "2s", "5s" 等
  backoff_max: "2s"

# ====================================
# 中间件配置（可选）
# v0.7.0+ 支持内置中间件
# ====================================
middleware:
  # 日志中间件（记录请求日志）
  logging: true

  # 恢复中间件（捕获 panic）
  recover: true

  # 认证中间件（用户/群组白名单）
  auth: false
  auth_whitelist:
    - "user_id_1"
    - "user_id_2"
    - "group_id_1"

  # 限流中间件（令牌桶算法）
  rate_limit: false
  rate_limit_rate: 100                      # 每秒生成的令牌数
  rate_limit_burst: 200                     # 令牌桶容量（允许突发）
  rate_limit_max_buckets: 10000             # 限流桶数量上限
  rate_limit_bucket_ttl: "10m"              # 限流桶过期时间
  rate_limit_cleanup_interval: "5m"         # 限流桶清理间隔

  # 去重中间件
  dedup_enable: false
  dedup_max_size: 10000                     # 最大缓存条目数
  dedup_default_ttl: "5m"                   # 默认去重 TTL
  dedup_cleanup_interval: "1m"              # 清理间隔

  # 慢处理器中间件（用于监控和调试）
  slow_handler_enable: false
  slow_handler_threshold: "1s"              # 慢处理阈值

  # 指标收集中间件（Prometheus）
  # v0.7.1+ 支持 Prometheus 集成
  metrics: true

  # 自适应降级 CPU 阈值（百分比，0-100），支持热更新
  degradation_cpu_threshold: 80.0

  # 自适应降级内存阈值（百分比，0-100），支持热更新
  degradation_memory_threshold: 85.0

# ====================================
# 死信队列配置（可选）
# v0.7.0+ 支持失败事件持久化
# ====================================
dead_letter:
  # 是否启用死信队列
  enable: true

  # 目标类型: file（文件）, kafka（Kafka）, webhook（Webhook）
  target: "file"

  # 文件目标配置（target=file 时生效）
  file_path: "./dead_letters.log"

  # Kafka 目标配置（target=kafka 时生效）
  kafka_brokers:
    - "localhost:9092"
  kafka_topic: "bot-dead-letters"

  # Webhook 目标配置（target=webhook 时生效）
  webhook_url: "https://your-webhook-endpoint.com/dead-letters"

# ====================================
# Webhook 配置（可选）
# v0.7.0+ 增强配置
# ====================================
webhook:
  # 事件通道缓冲大小
  # 推荐值: 1000-5000（根据流量调整）
  event_buffer: 1000

  # 并发事件处理的 worker 数量
  # 0 表示使用 CPU 核心数，推荐值: 4-16（根据并发需求调整）
  worker_count: 0

  # 是否启用事件去重
  # v0.7.0+ 使用 BigCache 实现高效去重
  dedup_enable: true

  # BigCache 分片数（2的幂次）
  # 推荐值: 1024（默认）
  shards: 1024

  # 去重缓存生命周期
  # 格式: "1m", "5m", "10m" 等
  life_window: "5m"

  # 清理过期条目的间隔时间
  # 格式: "30s", "1m", "5m" 等
  clean_window: "1m"

  # 单个缓存条目的最大字节数
  # 推荐值: 1024-4096 bytes
  max_entry_size: 4096

  # 最大缓存大小（MB）
  # 推荐值: 50-200 MB
  hard_max_cache_size: 100

  # BigCache 窗口内最大条目数
  # 推荐值: 600000（默认 1000*10*60）
  max_entries_in_window: 600000

# ====================================
# Token 管理器配置（可选）
# ====================================
token:
  # Token 获取失败重试延迟
  # 格式: "5s", "10s", "30s" 等
  retry_delay: "10s"

  # 提前多久刷新 Token
  # 格式: "30s", "1m", "2m" 等
  refresh_advance: "30s"

  # 最小刷新时间比例（expires_in * ratio）
  # 如果 expires_in 小于 2*refresh_advance，则使用此比例计算刷新时间
  min_refresh_ratio: 0.5

# ====================================
# Engine 引擎配置（可选）
# ====================================
engine:
  # 临时 Matcher 清理间隔
  # 格式: "1m", "5m", "10m" 等
  temp_matcher_cleanup_interval: "5m"

  # 批量删除通道大小
  # 推荐值: 1000-10000（根据 Matcher 创建频率调整）
  pending_delete_buffer_size: 1000

  # 批量删除处理间隔
  # 格式: "50ms", "100ms", "200ms" 等
  pending_delete_process_interval: "100ms"

  # 每次批量删除数量
  # 推荐值: 100-1000
  pending_delete_batch_size: 1000

  # Matcher 池初始容量
  # 推荐值: 16-64
  matcher_pool_capacity: 16

  # Matcher 池最大容量
  # 推荐值: 1024-4096
  matcher_pool_max_capacity: 1024

  # 临时 Matcher 分片数
  # 推荐值: 8-32（2的幂次）
  temp_matcher_shard_count: 8

# ====================================
# 自适应降级配置（高级功能，可选）
# ====================================
degradation:
  # 是否启用自适应降级
  enable: false

  # CPU 使用率阈值（百分比，0-100）
  # 超过此值开始降级
  cpu_threshold: 80.0

  # 内存使用率阈值（百分比，0-100）
  memory_threshold: 85.0

  # 延迟阈值
  # 格式: "100ms", "500ms", "1s" 等
  latency_threshold: "500ms"

  # 监控间隔
  # 格式: "1s", "5s", "10s" 等
  monitor_interval: "5s"

  # 恢复检查间隔
  # 格式: "5s", "10s", "30s" 等
  recovery_interval: "10s"

  # 延迟队列大小（延迟策略使用）
  delay_queue_size: 1000

  # 协程数量阈值
  goroutine_threshold: 10000

  # 降级策略: drop（丢弃）, delay（延迟）, simplify（简化）
  strategy: "drop"

# ====================================
# 分布式追踪配置（可选）
# v0.8.0+ 支持 OpenTelemetry 集成
# ====================================
tracing:
  # 是否启用分布式追踪
  enable: false

  # 服务名称（用于追踪后端展示）
  service_name: "remilia-bot"

  # 服务版本
  service_version: "1.0.0"

  # 部署环境: dev, staging, prod
  environment: "dev"

  # 导出器类型: otlp（Tempo/Grafana）, zipkin, stdout
  exporter: "otlp"

  # 追踪后端地址
  # OTLP (Tempo/Grafana): http://localhost:4318
  # Zipkin: http://localhost:9411/api/v2/spans
  endpoint: "http://localhost:4318"

  # 采样率 (0.0 - 1.0)
  # 1.0 = 全量采样，0.1 = 10% 采样
  sampling_rate: 1.0

  # 是否在 Span 中包含事件详情（内容、作者等）
  include_event_detail: false

  # 额外的 HTTP 请求头（用于 OTLP 认证，可选）
  # headers:
  #   Authorization: "Bearer your_token"
  #   X-Custom-Header: "value"

# ====================================
# 配置说明
# ====================================
# 1. 必填配置: bot, server, log
# 2. 可选配置: concurrency, retry, middleware, dead_letter, webhook, token, engine, degradation, tracing
# 3. 环境变量支持:
#    - BOT_APP_ID
#    - BOT_BOT_ID
#    - BOT_TOKEN
#    - BOT_SECRET
# 4. 配置热重载: 使用 config.Watch() 监听配置变更
# 5. 性能调优:
#    - webhook.worker_count: 控制并发处理能力（测试显示8并发可达6127 msg/s）
#    - webhook.event_buffer: 控制事件缓冲区大小
#    - engine.*: 控制引擎内部行为和性能
# 6. 分布式追踪 (tracing):
#    - 需要部署 Grafana Tempo 或 Zipkin 等后端
#    - 生产环境建议设置 sampling_rate < 1.0 以降低开销
#
# 详细文档: docs/CONFIG.md, docs/CONFIGURATION_IMPROVEMENTS.md

