# Remilia Bot 配置文件示例
# 复制此文件为 config.yaml 并填入你的实际配置
#
# 热更新标注说明:
#   [H]    — 热更新生效，无需重启
#   [H⚠]  — 热更新生效但有注意事项
#   [R]    — 需要重启 Bot
#   [N/A]  — 不适用（预留字段暂未实现）

# ====================================
# Bot 平台配置  [R]
# 所有平台适配器的配置变更都需要完全重启 Bot 才能生效。
# 从 v1.14.1 开始支持平台热替换（SyncPlatforms）：
# 更换 Token/URL 或增删平台时零停机，但更换监听端口等
# 网络层变更仍需重启。
# ====================================
bot:
  # ----- QQ 机器人（QQ 官方 API / Webhook）-----           # [H⚠]
  qq:                                                          # 增删平台 → 零停机；更换 webhook.port → 需重启
    app_id: 123456789                                         # [H⚠] 更换后旧连接用完即断，新连接自动建立
    bot_id: 987654321                                         # [H⚠] 同上
    token: "your_qq_bot_token"                                # [H⚠] 同上
    secret: "your_qq_bot_secret"                              # [H⚠] 同上

    # Webhook 事件服务配置
    webhook:                                                  # [H⚠]
      host: "0.0.0.0"                                         # [R]  更换监听地址需释放旧端口再 bind
      port: 8080                                               # [R]  同上
      shutdown_timeout: "10s"                                  # [N/A] 仅创建时读取
      event_buffer: 1000                                       # [N/A] 仅创建时读取
      worker_count: 0                                          # [N/A] 仅创建时读取

    # QQ Token 管理器配置
    token_manager:
      retry_delay: "10s"                                      # [N/A] 仅创建时读取
      refresh_advance: "30s"                                   # [N/A] 仅创建时读取
      min_refresh_ratio: 0.5                                   # [N/A] 仅创建时读取

  # ----- OneBot V11 协议（go-cqhttp / NapCat 等）-----
  # onebot:                                                    # [H⚠]
  #   url: "ws://127.0.0.1:6700"                               # [H⚠]
  #   listen_addr: ":8080"                                     # [R]
  #   token: "your_onebot_token"                                # [H⚠]
  #   secret: "your_onebot_secret"                              # [H⚠]

  # ----- Discord Bot（Gateway WebSocket）-----
  # discord:                                                   # [H⚠]
  #   token: "your_discord_bot_token"                           # [H⚠]

  # ----- Satori 协议（Chronocat / Lagrange 等）-----
  # satori:                                                    # [H⚠]
  #   server_url: "http://localhost:5140"                       # [H⚠]
  #   token: "your_satori_token"                                # [H⚠]
  #   platform: "chronocat"                                     # [H⚠]
  #   user_id: "1234567890"                                     # [H⚠]

  # ----- Milky QQ 协议（NTQQ 协议端）-----
  # milky:                                                     # [H⚠]
  #   base_url: "http://127.0.0.1:6700"                         # [H⚠]
  #   access_token: "your_milky_token"                          # [H⚠]

  # ----- Telegram Bot（长轮询，默认）-----
  # telegram:                                                   # [H⚠]
  #   token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"        # [H⚠] 从 @BotFather 获取
  #   poll_timeout: 30                                            # [N/A] 长轮询超时（秒），默认 30

  # ----- Telegram Bot（Webhook，需公网 HTTPS）-----
  # 启用 webhook 配置块后，适配器将自动切换为 Webhook 模式接收更新，
  # 需在 @BotFather 设置 Webhook URL 为 https://your.domain/telegram。
  # telegram:                                                   # [R]
  #   token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"        # [H⚠] 更换后旧连接用完即断
  #   webhook:                                                   # [R]
  #     host: "0.0.0.0"                                          # [R]
  #     port: 8443                                                # [R] Telegram 要求 443/80/88/8443 之一
  #     shutdown_timeout: "10s"                                   # [N/A]
  #     event_buffer: 1000                                        # [N/A]
  #     worker_count: 0                                           # [N/A]

  # ----- 微信（预留）-----
  # wechat: {}

# ====================================
# 日志配置
# ====================================
log:
  # 日志级别: trace, debug, info, warn, error, fatal, panic    [H]
  level: "info"                                                # 修改后即时生效

  # 日志输出格式（向后兼容）: text / json                       [H⚠]
  format: "text"                                               # 重新初始化 logger，日志流暂断

  # 是否启用控制台输出                                         [H⚠]
  # console: true                                              # 重新初始化 logger

  # 是否启用文件输出                                           [H⚠]
  # file: false                                                # 重新打开文件句柄

  # 日志文件路径                                                [H⚠]
  # file_path: "logs/remilia.log"                               # 重新打开文件句柄

  # 时间戳格式                                                  [H]
  # time_format: "2006-01-02 15:04:05"                          # 修改后即时生效

# ====================================
# 重试配置（可选）
# 支持自动重试机制
# ====================================
retry:
  enable: true                                                 # [H]  修改后即时生效
  max_attempts: 3                                              # [H]  修改后即时生效
  backoff_base: "200ms"                                        # [H]  修改后即时生效
  backoff_max: "2s"                                            # [H]  修改后即时生效

# ====================================
# 中间件配置（可选）
# 支持内置中间件
# ====================================
middleware:
  logging: true                                                # [H]  运行时开关
  recover: true                                                # [H]  运行时开关
  metrics: true                                                # [H]  运行时开关

  auth:                                                        # [H]
    enable: false                                              # [H]  运行时开关，白名单热读
    whitelist:                                                 # [H]  增删用户即时生效
      - "user_id_1"
      - "user_id_2"
      - "group_id_1"

  rate_limit:                                                  # [H⚠]
    enable: false                                              # [H]  运行时开关
    rate: 100                                                   # [N/A] 由自适应限流器管理
    burst: 200                                                  # [H]  作为 AdjustStep 传入
    max_buckets: 10000                                         # [N/A] 仅创建时读取
    bucket_ttl: "10m"                                          # [N/A] 仅创建时读取
    cleanup_interval: "5m"                                     # [N/A] 仅创建时读取

  dedup:                                                       # [H]
    enable: false                                              # [H]  运行时开关
    max_size: 10000                                            # [H]  修改后即时生效
    default_ttl: "5m"                                          # [H]  修改后即时生效
    cleanup_interval: "1m"                                     # [N/A] 仅创建时读取

  slow_handler:                                                # [H]
    enable: false                                              # [H]  运行时开关
    threshold: "1s"                                            # [H]  每次请求热读

  backpressure:                                                # [H⚠]
    limit: 500                                                  # [H]  limit>0 启用，limit<=0 关闭；修改 limit 值需重启
    policy: "trywait"                                          # [N/A] 仅创建时读取
    wait_timeout: "500ms"                                      # [N/A] 仅创建时读取

  degradation:                                                 # [H⚠]
    enable: false                                              # [H]  运行时开关
    cpu_threshold: 80.0                                         # [H]  下一监控周期生效
    memory_threshold: 85.0                                      # [H]  下一监控周期生效
    latency_threshold: "500ms"                                  # [H]  下一监控周期生效
    monitor_interval: "5s"                                      # [H]  下一监控周期生效（ticker 重建）
    recovery_interval: "10s"                                    # [N/A] 需要重建控制器
    delay_queue_size: 1000                                      # [N/A] 仅创建时读取
    goroutine_threshold: 10000                                  # [H]  下一监控周期生效
    strategy: "drop"                                            # [H]  运行时读取

# ====================================
# 死信队列配置（可选）                                           [R]
# 支持失败事件持久化，所有变更需重启生效
# ====================================
dead_letter:
  enable: true                                                 # [R]
  target: "file"                                               # [R]
  file_path: "./dead_letters.log"                              # [R]
  kafka_brokers:                                               # [R]
    - "localhost:9092"
  kafka_topic: "bot-dead-letters"                              # [R]
  webhook_url: "https://your-webhook-endpoint.com"             # [R]

# ====================================
# Engine 引擎配置（可选）                                        [R]
# 引擎初始化时读取，所有变更需重启生效
# ====================================
engine:
  temp_matcher_cleanup_interval: "5m"                          # [R]
  pending_delete_buffer_size: 1000                             # [R]
  pending_delete_process_interval: "100ms"                     # [R]
  pending_delete_batch_size: 1000                              # [R]
  matcher_pool_capacity: 16                                    # [R]
  matcher_pool_max_capacity: 1024                              # [R]
  temp_matcher_shard_count: 8                                  # [R]

# ====================================
# 分布式追踪配置（可选）
# ====================================
tracing:
  enable: false                                                # [R]  需重建 TracerProvider
  service_name: "remilia-bot"                                  # [R]  资源属性，仅创建时设定
  service_version: "1.0.0"                                     # [R]  同上
  environment: "dev"                                           # [R]  同上
  exporter: "otlp"                                             # [R]  需重建导出器连接
  endpoint: "http://localhost:4318"                            # [R]  需重建 OTLP 连接
  sampling_rate: 1.0                                           # [H⚠] 仅自适应模式支持运行时更新
  use_adaptive_sampling: false                                 # [R]  需重建采样器
  # adaptive_sampler: (嵌套字段全部 [R])                          [R]
  include_event_detail: false                                  # [H]  运行时开关
  # headers: (自定义 HTTP 头全部 [R])                            [R]

# ====================================
# pprof 性能分析配置（可选）
# ====================================
pprof:
  enabled: false                                               # [R]  需重启 HTTP 服务器
  addr: ":9001"                                                # [R]  同上
  auto_profile: false                                          # [H]  运行时生效
  profile_interval: "1h"                                       # [H]  运行时生效（下一周期）
  profile_duration: "30s"                                      # [H]  运行时生效
  output_dir: "data/profiles"                                  # [R]  仅创建时读取
  enable_mutex: false                                          # [H]  运行时生效
  enable_block: false                                          # [H]  运行时生效

# ====================================
# 管理 API 配置（可选）                                          [R]
# 所有变更需重启生效
# ====================================
api:
  enabled: true                                                # [R]
  addr: ":9002"                                                # [R]
  api_key: ""                                                  # [R]

# ====================================
# 插件扩展配置（可选）
# ====================================
# plugins:
#   ai: (所有字段 [R] 各插件通过 YAMLConfigProvider 读取，仅在插件启动时加载)
#     # —— 提供商与模型 ——
#     provider: "openai"                  # [R] LLM 提供商: openai（默认，兼容 DeepSeek/Kimi 等）/ anthropic
#     model: "gpt-4o-mini"                # [R] 模型名称（DeepSeek: deepseek-chat / deepseek-reasoner）
#     base_url: ""                        # [R] API 地址；空 = 默认（OpenAI https://api.openai.com/v1，
#                                         #     DeepSeek https://api.deepseek.com，Anthropic https://api.anthropic.com，
#                                         #     Ollama http://localhost:11434/v1）
#     api_key: "${AI_API_KEY}"            # [R] API 密钥，推荐环境变量引用
#     system_prompt: "你是 Remilia Bot 的 AI 助手。"  # [R] 自定义系统提示词（角色/个性/行为约束，追加在框架规则之后）
#     trigger_cmd: "/ai"                  # [R] AI 对话触发命令前缀；空 = 不注册命令触发
#
#     # —— 模型参数 ——
#     max_tokens: 2048                    # [R] 每次请求的最大输出 token 数
#     max_depth: 5                        # [R] 工具调用的最大递归深度（防止工具循环过深）
#     max_history: 20                     # [R] 保留的最大消息轮数（user+assistant 算一轮），超出从中间裁剪
#     temperature: 0.7                    # [R] 采样温度 0-2，越高输出越随机
#     top_p: 1.0                          # [R] 核采样参数 0-1，替代 temperature 使用
#     api_timeout: "60s"                  # [R] API 请求超时
#     max_retries: 0                      # [R] 请求失败时的最大重试次数（0 = 不重试）
#     tool_timeout: "30s"                 # [R] 每个工具调用的最长执行时间；超时返回错误，对话继续
#     session_ttl: "24h"                  # [R] 会话过期时间，超过未活跃的会话被清理
#
#     # —— 触发方式 ——
#     at_bot: true                        # [R] 是否响应 @机器人的消息（群聊中 @机器人 触发）
#     group_autonomous: false             # [R] 群聊自主发言：不 @ 机器人也响应群内非命令消息
#                                         #     （等价官方 OpenClaw 插件的 requireMention=false，
#                                         #     需平台授予群全量消息权限）；默认 false = 仅 @ 触发
#     private_chat: true                  # [R] 是否自动响应私聊消息（命令消息自动跳过）
#     fallback: false                     # [R] 无命令匹配时是否由 AI 兜底回复（预留字段）
#
#     # —— 输出与多模态 ——
#     markdown: true                      # [R] 平台支持 MD 时用 Markdown 回复，否则回退纯文本
#     vision_enabled: true                # [R] 是否启用图片识别（不支持的模型建议关闭，如 deepseek-chat）
#     audio_enabled: false                # [R] 是否启用音频输入（仅 OpenAI 部分模型支持，Anthropic 不支持）
#     max_attachment_size: 20971520       # [R] 入站附件单文件大小上限（字节，默认 20MB），超出则跳过
#
#     # —— AI 工具 ——
#     tool_allowlist: []                  # [R] 显式允许暴露为 AI 工具的命令白名单；
#                                         #     [] = 自动发现所有无权限命令（旧行为）；非空 = 仅列表中的命令
#     tool_approval: "off"                # [R] 命令执行审批模式：off=不审批（默认）/ restricted=仅审批
#                                         #     标记 RequiresApproval 的工具 / always=审批所有工具调用。
#                                         #     审批交互：平台支持按钮时发送"允许/拒绝"按钮，任何平台可用
#                                         #     /ai approve <ID> 与 /ai deny <ID> 文本命令。仅发起者可审批。
#     approval_timeout: "60s"             # [R] 审批等待超时；超时按拒绝处理
#
#     # —— per-group 策略（/ai group，LevelDB 持久化 data/ai）——
#     # 每个群可独立配置以下四项（群管理员用 /ai group set 修改；全局默认需 superadmin）：
#     #   prompt    群级系统提示词（覆盖全局 system_prompt）
#     #   tools     群级工具白名单（all=全部 / none=禁用全部工具 / 逗号分隔工具名）
#     #   approval  群级审批模式（off/restricted/always，覆盖全局 tool_approval）
#     #   mention   群级 @ 触发要求（on=必须 @，off=自主发言）
#
#     # —— 技能（Skill）系统 ——
#     max_user_skills: 10                 # [R] 每个用户最多可注册的技能数
#     max_user_skill_prompt_len: 2000     # [R] 用户技能 Prompt 的最大字符数
#     skill_timeout: "60s"                # [R] 每个 Skill 执行的最大时长
#     skill_max_depth: 3                  # [R] Skill 内部工具调用的最大递归深度
#
#     # —— 隐私控制（随请求发送给第三方 LLM 的内容）——
#     include_runtime_context: true       # [R] 是否注入运行时上下文（用户/群聊/时间等）。false = 完全不注入
#     context_fields: []                  # [R] 运行时上下文字段白名单；[] = 全部。
#                                         #     可选: time, platform, bot_id, bot_name,
#                                         #     user_name, user_id, user_is_bot, chat_type,
#                                         #     chat_id, chat_name, parent_id, group_role
#     include_mention_info: true          # [R] 是否将本条消息 @ 提及的其他用户昵称注入用户消息
#
#     # —— 结构级上下文（依赖 messagelog 消息历史）——
#     include_reply_context: true         # [R] 是否注入"被回复消息"的内容；机器人自己的对话回复也会被记录
#     context_group_messages: 10          # [R] 注入系统提示的最近群消息条数；0 = 关闭（默认 10，开启 AI 感知群聊历史）
#     context_group_include_bot: false    # [R] 群聊消息窗口是否包含机器人的出站回复（AI 与其他插件的回复，
#                                         #     以机器人自身名称标注，未注入时兜底"机器人"，并附说明行
#                                         #     提示由本账号发出）；默认 false。开启后与当前会话历史重合的
#                                         #     AI 回复自动去重，不会重复出现
#   weather:
#     api_key: "your-weather-api-key"
#   sauce:
#     proxy: ""                   # [R]  引擎请求代理地址（如 "http://127.0.0.1:7890"）。
#                                 #      国内部署访问 SauceNAO / IQDB 等被墙站点必需；
#                                 #      空 = 环境变量代理或直连
#     saucenao_api_key: ""        # [H]  SauceNAO API Key（从 https://saucenao.com 获取）
#     saucenao_db: 999            # [H]  SauceNAO 检索数据库（999 = 全部，可选具体 db id）
#     max_results: 3              # [H]  最多返回的结果数
#     send_thumbnails: false      # [H]  是否发送缩略图图片。开启后每条结果带图发送：
#                                 #      支持图文同发的平台（Telegram / Discord /
#                                 #      OneBot / Satori）文本与图片在同一条消息；
#                                 #      其他平台（QQ 等富媒体会丢弃文本）图片逐张发、
#                                 #      作品信息汇总一条（Markdown 优先）。
#     enable_iqdb: true           # [H]  IQDB：booru 图库检索，对裁切图最友好（免费，默认开启）
#     iqdb_timeout: "45s"         # [H]  IQDB 单次请求超时（高峰期排队时单次可达 60s）
#     iqdb_retries: 1             # [H]  IQDB 失败重试次数（排队/断流时重试可拿到新的队列位置）
#     iqdb_grace: "10s"           # [H]  其他引擎结果就绪后为 IQDB 额外等待的宽限期。
#                                 #      宽限期内返回 → 合并为一条消息；超时 → 先发其他引擎
#                                 #      结果并提示"IQDB 排队中"，完成后补发
#     enable_trace_moe: true      # [H]  TraceMoe：动画截图逐帧识别，给出番名/话数/时间点（免费，默认开启）
#     trace_moe_min_similarity: 75  # [H]  TraceMoe 最低相似度（0-100），过滤无意义弱匹配
#     enable_animetrace: true     # [H]  AnimeTrace：动画/Galgame 图片角色与作品识别（免费，默认开启）
#     search_timeout: "90s"       # [H]  单次检索总体超时（下载+预处理+全部引擎并发）
#     image_wait_timeout: "60s"   # [H]  发送 /sauce 未带图片时等待用户补发图片的超时；
#                                 #      超时或发送非图片消息即取消
#     similarity_threshold: 60    # [H]  全局相似度阈值。存在不低于该值的匹配时只展示这些；
#                                 #      否则保留全部（避免裁切/滤镜图被过滤，0 = 不过滤）
#     upscale_small: true         # [H]  上传前将小图（任一边 < 400px，多为裁切图）放大 2 倍
#     report_errors: true         # [H]  引擎失败时在结果中显示原因
#     max_title_len: 120          # [H]  单条结果标题最大长度（rune，0 = 不截断）
#     max_message_len: 2000       # [H]  文本模式整条结果消息最大长度（rune，0 = 不截断）
#   anime:
#     api_base: "https://api.bgm.tv"  # [R]  Bangumi API 基础 URL，可更换为镜像/代理地址（如 http://api.bgm.tv）
#     proxy: ""                       # [R]  Bangumi API 与封面图请求代理地址（如 "http://127.0.0.1:7890"）。
#                                     #      国内部署访问 api.bgm.tv 时推荐配置；空 = 环境变量代理或直连
#                                     #      客户端自带 Cloudflare DNS (1.1.1.1) 绕过 DNS 污染，仅在
#                                     #      无代理直连时生效；配置代理后域名解析由代理端完成。
#   bilibili:
#     sessdata: ""                    # [R]  真实 B 站账号的 SESSDATA Cookie（浏览器登录 B 站后 F12 →
#                                     #      Application → Cookies 中复制）。匿名随机指纹 Cookie 极易
#                                     #      触发 -799 风控限流，配置后可稳定访问；空 = 仅随机指纹
#     proxy: ""                       # [R]  B 站 API 与封面图请求代理地址（如 "http://127.0.0.1:7890"）。
#                                     #      海外/云服务器部署（数据中心 IP 风控严格）时推荐配置；
#                                     #      空 = 环境变量代理或直连
#     watch_interval: "60s"           # [R]  开播订阅轮询间隔（下限 30s），开播通知的检测延迟取决于此值
#   pic:
#     # [H]  全局内容分级区间（精确档位或区间）:
#     #      档位（由轻到重）:
#     #        safe         安全级内容（gelbooru 新体系中的 general）
#     #        sensitive    轻度敏感级内容（泳装、暗示等）
#     #                      注意: 这是 gelbooru 迁移时新增的档位，旧三档体系
#     #                      （safe/questionable/explicit）没有对应档位——旧站点上
#     #                      此类内容归入 questionable。精确配置 sensitive 时
#     #                      仅 gelbooru 可用；想覆盖旧 questionable 语义请用
#     #                      "safe..questionable" 或 "sensitive..explicit"。
#     #        questionable 敏感级内容
#     #        explicit     露骨级内容（NSFW）
#     #      语法:
#     #        "safe"                   只发安全级（精确档位，默认）
#     #        "safe..questionable"     发 safe+sensitive+questionable（不含 explicit）
#     #        "questionable..explicit" 发 questionable+explicit（不含安全级图）
#     #        "all"                    全部档位，不限制
#     #      站点仅在其可提供的档位与区间有交集时参与请求，
#     #      例如 rating: "explicit" 时 safebooru / konachan 自动不可用。
#     rating: "safe"
#     # [H]  启用站点白名单（空 = 全部）:
#     #      safebooru / gelbooru / rule34 / konachan / yandere
#     #      各站档位映射（自动处理，无需配置）:
#     #        gelbooru   已迁移新体系: general↔safe, sensitive/questionable/explicit 一一对应
#     #        safebooru  仅 safe（新旧评级并存，均视为 safe）
#     #        rule34     仅 explicit
#     #        konachan   仅 safe（SFW 镜像）
#     #        yandere    旧体系: safe/questionable/explicit（无 sensitive 档）
#     sites: []                       # [H]  启用站点白名单（空 = 全部）:
#                                     #      safebooru / gelbooru / rule34 / konachan / yandere
#     max_count: 3                    # [H]  单次最多发送张数
#     recent_days: 730                # [H]  只发近 N 天内上传的图片（0 = 不过滤）。随机图片默认
#                                     #      取近两年（730 天）内上传的内容，避免总是抽到老图；
#                                     #      konachan / yande.re 用服务端 date 过滤，
#                                     #      safebooru / gelbooru / rule34 用上传时间客户端过滤；
#                                     #      /pic -recent <N> 可单次覆盖此值（0/all = 不过滤）
#     proxy: ""                       # [R]  图库请求代理地址（如 "http://127.0.0.1:7890"）。国内部署访问
#                                     #      gelbooru 等被墙站点必需；空 = 环境变量代理或直连
#     gelbooru_user_id: ""            # [R]  gelbooru.com 必需（与 gelbooru_api_key 配套，免费注册获取），否则返回 401
#     gelbooru_api_key: ""            # [R]  gelbooru.com API key（免费注册获取），否则返回 401
#     rule34_user_id: ""              # [R]  rule34.xxx 必需，在 https://rule34.xxx/index.php?page=account&s=options 获取
#     rule34_api_key: ""              # [R]  rule34.xxx API key（与 rule34_user_id 配套）
#   updater:
#     # [H]  自动检查周期，0 = 关闭后台自动检查（/update 命令仍可用）
#     #      /update auto on|off 可运行时切换自动检查开关（持久化）
#     #      低于 10 分钟会被钳制（GitHub 匿名 API 限流 60 次/小时）
#     check_interval: "6h"
#     # [H]  发现新版本后是否后台自动应用并重启（高危，建议保持 false：
#     #       自动更新绕过人工确认，坏版本会导致机器人反复启动失败）
#     auto_apply: false
#     # [R]  更新源仓库（owner/repo），从该仓库的 GitHub Releases 获取发布包
#     repo: "KomeiDiSanXian/remilia"
#     # [H]  替换前是否备份旧二进制（/update rollback 依赖它）
#     backup: true
#     # [H]  是否考虑 pre-release 版本（默认只跟踪正式版）
#     allow_prerelease: false
#     # [R]  拉起子进程（新版本进程）的控制台策略:
#     #        ""      安全默认：不向子进程传任何控制台句柄，输出接到 NUL。
#     #                子进程日志请配合 log.file 落盘。
#     #                注意：不要使用"继承父进程控制台"的方案——Windows 会把
#     #                持有父控制台句柄的 DETACHED 子进程视为与控制台关联，
#     #                父进程退出时子进程会被连带终止（实测）。
#     #        "new"   Windows 上为新进程创建独立控制台窗口（CREATE_NEW_CONSOLE），
#     #                日志自成一窗，与父进程完全独立——这是唯一"日志可见且
#     #                子进程存活"的方案，pwsh/终端启动推荐
#     #        "file"  子进程 stdout/stderr 重定向到 data/updater/child.log，
#     #                无窗口、无控制台依赖，适合服务化场景
#     #      其余平台（Linux/macOS）无控制台概念，此配置不生效
#     child_console: ""
#     # [H]  容器环境（存在 /.dockerenv）是否禁用自更新——
#     #       容器内替换二进制无意义（重启后回到原镜像），应 docker pull 新镜像
#     disable_in_container: true
#     # [R]  GitHub API / 下载代理（与 pic 的 proxy 相同语义），如 "http://127.0.0.1:7890"
#     proxy: ""
#     # [R]  单次请求（API/下载）超时
#     timeout: "10m"

# ====================================
# 配置说明
# ====================================
# 1. 必填配置: bot, log
# 2. 可选配置: retry, middleware, dead_letter, engine, tracing, pprof
# 3. 环境变量支持（仅 QQ 平台，无配置文件时生效）:
#    - QQ_APP_ID / QQ_BOT_ID / QQ_TOKEN / QQ_SECRET
# 4. 热更新概览:
#    [H]  即时生效 — 修改后写入文件即自动加载
#    [H⚠] 有条件 — 见各字段注释
#    [R]  需重启 — 修改后执行 POST /api/v1/config/reload 或重启发进程
# 5. 性能调优:
#    - webhook.worker_count: 控制并发处理能力
#    - webhook.event_buffer: 控制事件缓冲区大小
#    - engine.*: 控制引擎内部行为和性能
# 6. 分布式追踪 (tracing):
#    - 需要部署 Grafana Tempo 或 Zipkin 等后端
#    - 生产环境建议设置 sampling_rate < 1.0 以降低开销
#
# 详细文档: docs/CONFIG.md, docs/CONFIGURATION_IMPROVEMENTS.md
