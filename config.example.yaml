#     system_prompt: "你是一个有用的AI助手"        # 系统提示词
#     max_tokens: 2048                            # 最大输出 token 数
#     max_depth: 5                                # 最大工具调用递归深度
#     max_history: 20                             # 保留的最大对话轮数
#     session_ttl: "24h"                          # 会话过期时间
#     trigger_cmd: "/ai"                          # 触发命令前缀
#     at_bot: true                                # @机器人 时触发
#     private_chat: true                          # 私聊自动触发
#     fallback: false                             # 无命令匹配时是否兜底回复
#   weather:
#     api_key: "your-weather-api-key"
#     timeout: 10
#   translate:
#     provider: "mymemory"
#     daily_limit: 1000
#   antispam:
#     user_rate: 5
#     user_burst: 10
#     group_rate: 30
#     group_burst: 50
#     ban_on_violation: true
#     ban_duration: "5m"
#   keywordfilter:
#     keywords:
#       - "敏感词1"
