version: "2"
linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - SA*
        - S*
        - QF*
        - -QF1012
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (net/http.Response).Close
        - os.Remove
        - os.RemoveAll
        - os.WriteFile
        - os.Chdir
        - os.Setenv
        - os.Unsetenv
        - syscall.SyscallN
        - fmt.Sscanf
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
        - (net/http.Request).ParseForm
        - encoding/json.Encoder.Encode
        - math/rand.Read
        - encoding/json.Unmarshal
        - (net.Conn).SetDeadline
        - io/fs.WalkDir
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: cmd/bot/plugins
        text: Error return value
        linters:
          - errcheck
      - path: examples
        text: Error return value
        linters:
          - errcheck
      - path: testbot
        text: Error return value
        linters:
          - errcheck
      - path: builtin
        text: Error return value
        linters:
          - errcheck
      - path: plugin/wasm
        text: Error return value
        linters:
          - errcheck
      - path: infra/textimage
        text: Error return value
        linters:
          - errcheck
      - path: platform/qq/openapi
        text: Error return value
        linters:
          - errcheck
