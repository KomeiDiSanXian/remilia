version: "2"
linters:
  # TODO(go1.27): staticcheck / unused 依赖 honnef.co/go/tools，尚未支持 Go 1.27
  # （export data version 4 > 最大支持 2，nilness 亦会 panic）。
  # 临时仅启用 errcheck + ineffassign；待上游支持后恢复 default: standard 与下方配置。
  default: none
  enable:
    - errcheck
    - ineffassign
    # - staticcheck
    # - unused
  settings:
    # staticcheck:
    #   checks:
    #     - SA*
    #     - S*
    #     - QF*
    #     - -QF1012
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (*net/http.Response).Close
        - os.Remove
        - os.RemoveAll
        - os.WriteFile
        - os.Chdir
        - os.Setenv
        - os.Unsetenv
        - syscall.SyscallN
        - fmt.Sscanf
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
        - (net/http.Request).ParseForm
        - encoding/json.Encoder.Encode
        - math/rand.Read
        - encoding/json.Unmarshal
        - (net.Conn).SetDeadline
        - io/fs.WalkDir
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: cmd/bot/plugins
        text: Error return value
        linters:
          - errcheck
      - path: examples
        text: Error return value
        linters:
          - errcheck
      - path: testbot
        text: Error return value
        linters:
          - errcheck
      - path: builtin
        text: \.(Close|Reply)`
        linters:
          - errcheck
      - path: infra/textimage
        text: \.Close`
        linters:
          - errcheck
      - path: plugin/wasm
        text: \.Close`
        linters:
          - errcheck
      - path: plugin/wasm
        text: \.Reply`
        linters:
          - errcheck
      - path: platform/qq/openapi/openapi.go
        text: \.Close`
        linters:
          - errcheck
      - path: platform/qq/openapi/openapi.go
        text: \.WaitReady`
        linters:
          - errcheck
