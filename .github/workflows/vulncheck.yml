name: govulncheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
