name: Release

on:
  push:
    tags: ["v*"]
  # 手动重跑：发布失败（或需要补产物）时按同一个标签重新触发，无需移动/重推标签。
  # tag 必填，工作流会检出该标签而不是当前分支。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例：v1.74.0）"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # 产物来源证明（attestation）：签发 OIDC 证书 + 写入 attestation 存储
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 手动触发时检出目标标签；标签推送时 github.ref_name 本身就是该标签
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npm run build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/

      - name: Set up QEMU
        # 镜像含 arm64/armv7：跨架构构建要靠 QEMU 执行它们的 RUN 步骤
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        # dockers_v2 用 buildx 一次构建多平台索引（默认 builder 不支持多平台）
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # CHANGELOG 里对应版本的段落就是发布说明；缺失时回退 GoReleaser 自动 changelog。
        # 写到 runner 临时目录：GoReleaser 会把未跟踪文件也算作"脏工作区"并拒绝发布。
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          if node scripts/release-notes.mjs "$TAG" > "$notes"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md 中没有 $TAG 的段落，改用自动生成的 changelog"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          # --release-notes 会让 GoReleaser 跳过自带 changelog，直接用该文件作为 Release 正文
          args: release --clean ${{ steps.notes.outputs.found == 'true' && format('--release-notes={0}', steps.notes.outputs.path) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动触发时固定当前标签，避免 GoReleaser 从检出状态推断出别的版本
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Attest build provenance
        # subject-checksums 把 checksums.txt 里列出的每个文件登记为 subject —— 11 个归档一次覆盖
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Attest container image provenance
        # digests.txt 由 dockers_v2 产出，其中 sha256 前缀已按 GitHub 要求裁掉（官方 Attestations 配方）
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt

  updater-key-check:
    name: Check updater signing key
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        # secrets 不能直接写在 if 条件里，先落成 job 输出再判断
        run: echo "available=${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (Windows)
    # 等 GoReleaser 建好 Release 再上传安装包，避免两个 job 竞争创建
    needs: [goreleaser, updater-key-check]
    # 未配置签名密钥时跳过桌面端构建（普通发布不受影响）
    if: needs.updater-key-check.outputs.available == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 与 GoReleaser 同一个标签：手动触发时也要构建该标签的代码
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json

      - name: Build Dashboard
        shell: pwsh
        run: |
          Push-Location dashboard
          npm ci
          npm run build
          Pop-Location
          New-Item -ItemType Directory -Force cmd/bot/dashboarddist | Out-Null
          Copy-Item dashboard/dist/* cmd/bot/dashboarddist -Recurse -Force

      - name: Build Go sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X github.com/KomeiDiSanXian/remilia.Version=${{ inputs.tag || github.ref_name }} -X main.commit=${{ github.sha }} -X main.date=$date"
          go build -trimpath -ldflags $ldflags -o desktop/src-tauri/binaries/remilia-bot-x86_64-pc-windows-msvc.exe ./cmd/bot

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Sync desktop version from tag
        # 桌面端内置 sidecar，每个框架版本都应作为一次桌面端发布
        run: node desktop/scripts/sync-version.mjs ${{ inputs.tag || github.ref_name }}

      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}

      - name: Attest build provenance
        # 安装包在应用内更新链路之外没有任何签名，来源证明是它们唯一的可验证出处
        uses: actions/attest@v4
        with:
          subject-path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android (arm64 APK)
    # 复用 android.yml：等 GoReleaser 建好 Release 再上传 APK，避免两个 job 竞争创建
    needs: [goreleaser]
    uses: ./.github/workflows/android.yml
    with:
      # 显式传标签：手动重跑时复用工作流内的 GITHUB_REF 是触发分支，
      # 不传会导致它只产出 artifact、不上传 APK
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      contents: write
      # 复用工作流内要做 attestation，调用方必须放行这两个权限（否则打标签时才发现）
      id-token: write
      attestations: write
