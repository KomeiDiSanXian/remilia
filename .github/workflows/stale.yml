name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not seen
            activity in 90 days. It will be closed in 14 days if no further activity occurs.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not seen
            activity in 90 days. It will be closed in 14 days if no further activity occurs.
          close-issue-message: >
            This issue has been closed automatically due to inactivity.
          close-pr-message: >
            This PR has been closed automatically due to inactivity.
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned
