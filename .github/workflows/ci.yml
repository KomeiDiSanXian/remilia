name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: "1.26"

jobs:
  fmt:
    name: go fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check go fmt
        run: |
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: go vet
        run: go vet ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: staticcheck
        run: |
          pkgs=$(go list ./... | grep -v /examples | grep -v /testbot | tr '\n' ' ')
          go run honnef.co/go/tools/cmd/staticcheck@latest $pkgs

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Download dependencies
        run: go mod download
      - name: Run tests with race and coverage
        run: go test -count=1 -race -shuffle=on -coverprofile=coverage.out -covermode=atomic -timeout 180s ./...
      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, vet, staticcheck, lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Build
        run: go build -v ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...
