name: CI

on:
  push:
    branches: [master, main]
    tags: [v*]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev libvips-dev
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -count=1 -race -shuffle=on ./...
      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...
