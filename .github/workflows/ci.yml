name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: "1.26"

jobs:
  fmt:
    name: go fmt & fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: Apply go fmt
        run: go fmt ./...
      - name: Apply go fix
        run: go fix ./...
      - name: Detect changes
        id: detect
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open auto-fix pull request
        if: steps.detect.outputs.changed == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: apply gofmt and go fix"
          branch: "auto/fmt-fix"
          delete-branch: true
          base: master
          title: "style: apply gofmt and go fix"
          labels: ["auto-fix", "style"]
          body: |
            CI detected Go code that needs formatting (`gofmt`) or modernization (`go fix`).
            This PR was created automatically by the fmt job.

            > Merging this PR keeps the main branch clean.
      - name: Report unformatted code in PR
        if: steps.detect.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::warning::Go code needs gofmt/go fix. Run 'go fmt ./...' and 'go fix ./...' locally and re-push, or merge the auto/fmt-fix PR on master."
          git diff --stat

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: go vet
        run: go vet ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: staticcheck
        run: |
          pkgs=$(go list ./... | grep -v /examples | grep -v /testbot | tr '\n' ' ')
          go run honnef.co/go/tools/cmd/staticcheck@latest $pkgs

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Download dependencies
        run: go mod download
      - name: Run tests with race and coverage
        run: |
          pkgs=$(go list ./... | grep -v /examples | grep -v /cmd/bot/plugins | tr '\n' ' ')
          go test -count=1 -race -shuffle=on -coverprofile=coverage.out -covermode=atomic -timeout 180s $pkgs
      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, vet, staticcheck, lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Build
        run: go build -v ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...
