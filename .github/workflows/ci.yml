name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  fmt:
    name: go fmt & fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: Apply go fmt
        run: go fmt ./...
      - name: Apply go fix
        run: go fix ./...
      - name: Detect changes
        id: detect
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open auto-fix pull request
        if: steps.detect.outputs.changed == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: apply gofmt and go fix"
          branch: "auto/fmt-fix"
          delete-branch: true
          base: master
          title: "style: apply gofmt and go fix"
          labels: auto-fix, style
          body: |
            CI detected Go code that needs formatting (`gofmt`) or modernization (`go fix`).
            This PR was created automatically by the fmt job.

            > Merging this PR keeps the main branch clean.
      - name: Report unformatted code in PR
        if: steps.detect.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::warning::Go code needs gofmt/go fix. Run 'go fmt ./...' and 'go fix ./...' locally and re-push, or merge the auto/fmt-fix PR on master."
          git diff --stat

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: go vet
        run: go vet ./...

  staticcheck:
    name: staticcheck
    # Temporarily disabled: staticcheck crashes on Go 1.27 generic methods
    # (upstream golang/go#81188; no fixed staticcheck or Go release yet).
    # The lint job still runs staticcheck's SA*/S*/QF* checks via golangci-lint
    # with SA4023 excluded. Remove `if: false` once upstream ships a fix.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: staticcheck
        run: |
          pkgs=$(go list ./... | grep -v /examples | grep -v /testbot | tr '\n' ' ')
          go run honnef.co/go/tools/cmd/staticcheck@latest $pkgs

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Download dependencies
        run: go mod download
      - name: Run tests with race and coverage
        run: |
          pkgs=$(go list ./... | grep -v /examples | grep -v /cmd/bot/plugins | tr '\n' ' ')
          go test -count=1 -race -shuffle=on -coverprofile=coverage.out -covermode=atomic -timeout 180s $pkgs
      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  cmdbot:
    name: cmd/bot module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: Build
        run: |
          cd cmd/bot
          go build ./...
      - name: Vet
        run: |
          cd cmd/bot
          go vet ./...
      - name: Test
        run: |
          cd cmd/bot
          go test -count=1 -race -timeout 300s ./...
      - name: Check tidy
        run: |
          cd cmd/bot
          go mod tidy
          git diff --exit-code go.mod go.sum

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      # A hard crash inside a test binary (e.g. the 0xc0000005 seen in package
      # plugin) dumps only the faulting goroutine by default, and the frames
      # printed below its entry point are recycled-stack leftovers rather than a
      # real call chain. GOTRACEBACK=system dumps every goroutine with full
      # frames, so the next occurrence can be triaged instead of guessed at.
      GOTRACEBACK: system
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - name: Ensure dashboarddist for go:embed
        shell: bash
        run: mkdir -p cmd/bot/dashboarddist && touch cmd/bot/dashboarddist/.stub
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: |
          $pkgs = go list ./... | Where-Object { $_ -notmatch '/examples' }
          # Verbose output is captured to a file rather than the job log: if the
          # binary dies, the preceding "=== RUN" lines identify the test that was
          # running, and the full log is uploaded as an artifact below. A green
          # run stays quiet.
          $log = Join-Path $env:RUNNER_TEMP 'windows-test.log'
          go test -count=1 -timeout 300s -v $pkgs *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path $log)) {
            Write-Host '::group::last started tests'
            Select-String -Path $log -Pattern '=== RUN' | Select-Object -Last 20 | ForEach-Object { $_.Line }
            Write-Host '::endgroup::'
            Write-Host '::group::go test output (tail)'
            Get-Content $log -Tail 400
            Write-Host '::endgroup::'
          }
          if ($null -eq $code) { $code = 1 }
          exit $code
      - name: Run cmd/bot tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cmdbot-test.log'
          Set-Location cmd/bot
          go test -count=1 -timeout 300s -v ./... *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path $log)) {
            Write-Host '::group::last started tests'
            Select-String -Path $log -Pattern '=== RUN' | Select-Object -Last 20 | ForEach-Object { $_.Line }
            Write-Host '::endgroup::'
            Write-Host '::group::go test output (tail)'
            Get-Content $log -Tail 400
            Write-Host '::endgroup::'
          }
          if ($null -eq $code) { $code = 1 }
          exit $code
      - name: Upload Windows test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-logs
          path: ${{ runner.temp }}/*-test.log
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, vet, staticcheck, lint, test, cmdbot]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build Dashboard
        run: |
          (cd dashboard && npm ci && npx vite build)
          mkdir -p cmd/bot/dashboarddist
          cp -r dashboard/dist/* cmd/bot/dashboarddist/
      - name: Build
        run: go build -v ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...
