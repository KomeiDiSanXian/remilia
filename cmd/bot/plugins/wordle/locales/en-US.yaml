wordle.help: |
  Wordle guessing game
  Usage:
    /wordle [--length 4-7] [--tries N] [--daily] [--scope user|group]   start a classic game
    /wordle [--duet|--quad|--boards N]   multi-board: N boards share one guess stream
    /wordle [--hard] [--blind] [--fog[=N]] [--obscure] [--gauntlet]   harder modes
    /wordle [--blitz[=sec]] [--chain] [--hint-cost] [--chaos] [--race]   other modes
    /wordle guess <word>         submit a guess
    /wordle giveup               give up and reveal the answer
    /wordle hint [type]          hint: letter(default) / exclude / vowels / repeat
    /wordle board                resend the current board
    /wordle rules                show this game's modes and progress
    /wordle stats [@user]        show statistics
    /wordle top                  leaderboard
    /wordle lang <locale>        switch language (zh-CN / en-US)
  Modes (freely combinable):
    --hard       revealed green/yellow letters must be reused
    --blind      yellow is shown as gray; only exact positions turn green
    --fog        keep only the last N rows (default 1, max 4)
    --obscure    draw answers from low-frequency words only
    --gauntlet   chain mode loses one try per solved word (floor 2)
    --blitz      countdown per move, timeout loses (default 60s)
    --chain      solve one word and immediately get the next
    --hint-cost  each hint costs one try
    --chaos      start with random modifiers (blind/no-repeat/double/nohint)
    --race       score by contribution (group scope only)
  Color modes (freely stackable; they only change what you see, never the result):
    --invert     swap green (correct) and gray (absent)
    --hit-only   merge green into yellow; all position info is lost
    --near       teal: the letter is in the answer within ±1 of its true spot
    --repeat     purple: the answer has multiple copies of this letter
    --swap-meaning randomly swap the meaning of green/yellow per game
    --colorfog[=N] keep at most N colored tiles per row (default 2)
    --decay[=N]  keep colors only in the last N rows (default 2)
    --unknown[=N] hide N random tiles per row as a neutral "?" (default 1)
    --delayed[=N] the newest N rows show no color yet (default 1)
    --decoy[=N]  lie about N gray tiles per row, showing them as yellow (default 1)
    --glitch     flip one random tile color per row
    --mole       one random position always shows green for the whole game
    --hidden-key do not color the keyboard
    --score-color color the whole row by the number of greens (positions lost)
  Multi-board: --duet (2) / --quad (4) / --boards 2-4; every board shares the same
  guess stream and you win only after solving all of them.
  Defaults: random 4-7 letters, tries derived from length (6 for 5 letters),
  random puzzle, one shared board per chat, no extra modes.
