songdle.help: |
  Guess-the-rhythm-game-track (Songdle / Maidle style)
  Usage:
    /songdle [--tries N] [--type SD|DX|all] [--genre text] [--daily] [--artist]  start a round
    /songdle guess <title|alias|#id>  guess a track and compare every attribute (correct wins)
    /songdle artist <name>        probe the artist (also /songdle probe artist <name>)
    /songdle genre <text>         probe the genre
    /songdle type SD|DX           probe the chart type
    /songdle version <name>       probe the version
    /songdle bpm <number>         probe BPM (replies with ↑/↓)
    /songdle charter <name>       probe the MASTER chart designer
    /songdle const <number>       probe MASTER constant (replies with ↑/↓)
    /songdle break <number>       probe break count (replies with ↑/↓)
    /songdle board                resend the clue board
    /songdle giveup               give up and reveal the answer
    /songdle pool                 show the song pool size and categories
    /songdle stats [@user]        show stats
    /songdle top                  show the leaderboard
    /songdle lang <locale>        switch language (zh-CN / en-US)
    /songdle help                 show this help
  How to play:
    The bot picks a random maimai track and blacks out its title (only the length is shown).
    Guessing a whole track (by title, alias or #id) is the main loop: the bot compares
    it with the answer column by column:
      🟩 exact   🟨 close   ⬜ no match
      ↑ answer is newer / higher   ↓ answer is older / lower (version and numeric columns)
    An exact title or alias wins; running out of tries loses. A bare number is read as both
    a track ID and a title / alias: if the answer is among the candidates it wins, otherwise
    the bot asks you to use /songdle guess #<id>. Single attributes can still be probed:
    artist, genre, type, version, BPM, chart designer, constant, breaks.
  Options:
    --tries N      max guesses (default 12)
    --type type    only SD / DX tracks (default all)
    --genre text   only tracks whose genre contains the text
    --scope scope  isolation: user|group (default group-shared)
    --daily        daily track: everyone gets the same track that day
    --artist       reveal the artist at the start (easier)
  Song pool:
    Ships with maimai track + alias data (about 1300 entries). Point
    plugins.songdle's songs_file / alias_file at your own dataset, or use
    songs_url / alias_url to fetch it remotely.
