songdle.help: |
  猜音游曲目小游戏（Songdle / Maidle 风格）
  用法：
    /songdle [--tries N] [--type SD|DX|all] [--genre 关键词] [--daily] [--artist]  开始新的一局
    /songdle 猜 <曲名|俗称|#ID>  猜一首曲目，返回整行属性对比（猜中即获胜）
    /songdle 曲师 <名字>          探测曲师（也可写 /songdle probe 曲师 <名字>）
    /songdle 流派 <关键词>        探测流派
    /songdle 类型 SD|DX           探测谱面类型
    /songdle 版本 <版本名>        探测版本
    /songdle bpm <数值>           探测 BPM（会提示 ↑/↓）
    /songdle 谱师 <名字>          探测 MASTER 谱师
    /songdle 定数 <数值>          探测 MASTER 定数（会提示 ↑/↓）
    /songdle 绝赞 <数值>          探测绝赞数（会提示 ↑/↓）
    /songdle board                重新发送提示板
    /songdle giveup               放弃并公布答案
    /songdle pool                 查看曲库规模与分类
    /songdle stats [@用户]        查看战绩
    /songdle top                  查看排行榜
    /songdle lang <语言>          切换语言（zh-CN / en-US）
    /songdle help                 查看帮助
  玩法：
    机器人随机选一首 maimai（舞萌DX）曲目，并把曲名完全涂黑（只给长度）。
    推荐直接猜曲目：曲名、俗称、曲目 ID 都行，机器人会把猜的这首与谜底逐列对比：
      🟩 完全一致   🟨 接近   ⬜ 不匹配
      ↑ 谜底比所猜更新 / 更高   ↓ 谜底比所猜更旧 / 更低（版本与数值列）
    猜中曲名或俗称即获胜，次数用尽判负。纯数字输入会同时按「曲目 ID」和
    「曲名 / 俗称」解析：谜底在候选里就直接判中，否则提示改用 /songdle 猜 #<ID> 精确指定。
    想缩小范围也可以逐项探测单个属性，可探测：曲师、流派、类型、版本、BPM、谱师、定数、绝赞。
  选项：
    --tries N      猜测次数上限（默认 12）
    --type 类型    只出 SD / DX 的曲目（默认 all）
    --genre 关键词  只出该流派（子串匹配，如 东方 / VOCALOID）
    --scope 维度   隔离维度 user|group（默认群内共享一局）
    --daily        每日题：同一天同一筛选条件下所有人拿到同一首
    --artist       开局即公布曲师，降低难度
  曲库：
    内置 maimai 曲目与别名数据（约 1300 首），可用 plugins.songdle 的
    songs_file / alias_file 指向自备数据集，或 songs_url / alias_url 从远端拉取。
