dond.help: |
  成交不成交（Deal or No Deal）— 箱子里的虚拟奖金

  用法：
    /dond [--scope user|group] [--cases N]   开始一局（默认单人、26 箱，N 取 6-30）
    /dond pick <箱号|random>     选定自己的箱子
    /dond open <箱号...>         打开一个或多个箱子（可空格分隔，按钮可补全命令）
    /dond deal / nodeal          成交 / 不成交（群维度为投票）
    /dond resolve                群投票局提前结算当前报价（仅发起者）
    /dond swap / keep            仅剩两箱时交换 / 保留自己的箱子
    /dond board                  重新发送当前阶段图片
    /dond rules                  查看玩法说明
    /dond quit                   放弃本局（仅发起者）
    /dond lang <语言>            切换语言（zh-CN / en-US）

  玩法：
    开局 26 个箱子各藏一笔虚拟奖金，你选定一个作为自己的箱子。
    之后按轮次打开其余箱子揭示奖金；每轮结束后银行家按剩余箱子的
    期望值给出报价，你可以成交拿走报价，或不成交继续开箱。
    最后只剩两个箱子时可以选择交换，随后揭晓自己箱子的真实奖金。
    奖金为局内虚拟数值，不落库、不计排行榜。

  维度：
    --scope user   单人局（默认）：只有发起者能操作。
    --scope group  群投票局：群内任何人都能开箱；报价采用投票，
                   同意成交的票数超过参与者半数即成交，
                   也可用 /dond resolve 提前结算。

dond.rules: |
  成交不成交 · 玩法说明
  1. 26 个箱子各藏一笔奖金（$1 ~ $1,000,000），开局随机分配。
  2. 先选定一个箱子作为自己的，再按轮次打开其余箱子。
  3. 每轮开满后银行家按剩余箱子期望值报价，你选择成交或继续。
  4. 仅剩两个箱子时可交换，最后揭晓你箱子里的真实奖金。

