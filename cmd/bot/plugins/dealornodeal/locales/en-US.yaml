dond.help: |
  Deal or No Deal — virtual prize money in the briefcases

  Usage:
    /dond [--scope user|group] [--cases N]   Start a game (default: solo, 26 cases; N is 6-30)
    /dond pick <n|random>        Pick your own case
    /dond open <n...>            Open one or more cases (space-separated; buttons autocomplete)
    /dond deal / nodeal          Deal / No deal (a vote in group scope)
    /dond resolve                Settle the current offer vote early (starter only)
    /dond swap / keep            With two cases left: swap / keep your case
    /dond board                  Resend the current stage image
    /dond rules                  Show the rules
    /dond quit                   Abandon the game (starter only)
    /dond lang <locale>          Switch language (zh-CN / en-US)

  How it works:
    26 cases each hide a virtual prize. Pick one as yours, then open the
    others round by round. After each round the banker offers a price based
    on the expected value of the remaining cases: deal to take it, or keep
    playing. With two cases left you may swap, then your case is revealed.
    All money is in-game only — nothing is persisted and there is no ladder.

  Scope:
    --scope user   Solo (default): only the starter can act.
    --scope group  Group vote: anyone may open cases; the offer is a vote,
                   and a strict majority of participants deals.
                   /dond resolve settles the vote early.

dond.rules: |
  Deal or No Deal · Rules
  1. 26 cases hide $1 - $1,000,000, shuffled at the start.
  2. Pick one as your own, then open the others round by round.
  3. After each round the banker offers a price; deal or keep playing.
  4. With two cases left you may swap; finally your case is revealed.

