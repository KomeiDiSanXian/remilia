# Remilia 默认配置（fallback 自动使用）
# 当 config.yaml 不存在且环境变量不足以构建完整配置时启用。
#
# 热更新标注:
#   [H]  = 热更新生效 / [H⚠] = 有条件热更新 / [R] = 需重启

log:
  level: "info"                 # [H]
  format: "text"                # [H⚠]

retry:
  enable: true                  # [H]
  max_attempts: 3               # [H]
  backoff_base: "200ms"         # [H]
  backoff_max: "2s"             # [H]

middleware:
  logging: true                 # [H]
  recover: true                 # [H]
  metrics: true                 # [H]

dead_letter:
  enable: false                 # [R]

engine:                         # [R] 全部需重启
  temp_matcher_cleanup_interval: "5m"
  pending_delete_buffer_size: 1000
  pending_delete_process_interval: "100ms"
  pending_delete_batch_size: 1000
  temp_matcher_shard_count: 8
  matcher_pool_capacity: 16
  matcher_pool_max_capacity: 1024

api:                            # [R] 全部需重启
  enabled: true
  addr: ":9002"
  api_key: ""
